name: UI Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Launch on simulator and screenshot
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project VoxelArt3D.xcodeproj \
            -scheme VoxelArt3D \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Boot simulator, install and launch
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "UDID=$UDID"
          xcrun simctl list devices available | grep -i iphone | head -5 || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/VoxelArt3D.app"
          ls -d "$APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.shodai4.voxelart3d
          sleep 10
          xcrun simctl io "$UDID" screenshot editor.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: editor.png
          if-no-files-found: error

      - name: Crash logs (if any)
        if: always()
        run: |
          find ~/Library/Logs/DiagnosticReports -name 'VoxelArt3D*' -maxdepth 1 2>/dev/null | head -3 || true
          ls -la editor.png || true
